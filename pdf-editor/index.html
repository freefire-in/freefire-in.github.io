<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional PDF Editor</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/toolbar.css">
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/editor.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="light-mode">
    <div id="app-container">
        <!-- Top Toolbar -->
        <div id="toolbar" class="toolbar">
            <div class="toolbar-section">
                <button id="open-file-btn" class="toolbar-btn" title="Open PDF">
                    <i class="fas fa-folder-open"></i>
                    <span>Open</span>
                </button>
                <input type="file" id="file-input" accept=".pdf" style="display: none;">
            </div>

            <div class="toolbar-section">
                <button id="undo-btn" class="toolbar-btn" disabled title="Undo">
                    <i class="fas fa-undo"></i>
                </button>
                <button id="redo-btn" class="toolbar-btn" disabled title="Redo">
                    <i class="fas fa-redo"></i>
                </button>
            </div>

            <div class="toolbar-section">
                <button id="edit-mode-btn" class="toolbar-btn" disabled title="Toggle Edit Mode">
                    <i class="fas fa-edit"></i>
                    <span>Edit Mode</span>
                </button>
            </div>

            <div class="toolbar-section">
                <button id="zoom-out-btn" class="toolbar-btn" disabled title="Zoom Out">
                    <i class="fas fa-search-minus"></i>
                </button>
                <select id="zoom-select" class="toolbar-select" disabled>
                    <option value="fit-width">Fit Width</option>
                    <option value="fit-page">Fit Page</option>
                    <option value="0.5">50%</option>
                    <option value="0.75">75%</option>
                    <option value="1" selected>100%</option>
                    <option value="1.25">125%</option>
                    <option value="1.5">150%</option>
                    <option value="2">200%</option>
                </select>
                <button id="zoom-in-btn" class="toolbar-btn" disabled title="Zoom In">
                    <i class="fas fa-search-plus"></i>
                </button>
            </div>

            <div class="toolbar-section">
                <button id="first-page-btn" class="toolbar-btn" disabled title="First Page">
                    <i class="fas fa-step-backward"></i>
                </button>
                <button id="prev-page-btn" class="toolbar-btn" disabled title="Previous Page">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <input type="number" id="page-input" class="page-input" min="1" disabled>
                <span id="page-count" class="page-count">/ 0</span>
                <button id="next-page-btn" class="toolbar-btn" disabled title="Next Page">
                    <i class="fas fa-chevron-right"></i>
                </button>
                <button id="last-page-btn" class="toolbar-btn" disabled title="Last Page">
                    <i class="fas fa-step-forward"></i>
                </button>
            </div>

            <div class="toolbar-section">
                <button id="export-btn" class="toolbar-btn toolbar-btn-primary" disabled title="Export PDF">
                    <i class="fas fa-download"></i>
                    <span>Export</span>
                </button>
            </div>

            <div class="toolbar-section toolbar-section-right">
                <button id="dark-mode-toggle" class="toolbar-btn" title="Toggle Dark Mode">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>

        <!-- Main Content Area -->
        <div id="main-content" class="main-content">
            <!-- Left Sidebar -->
            <div id="sidebar" class="sidebar">
                <div class="sidebar-header">
                    <h3>Pages</h3>
                    <button id="toggle-sidebar-btn" class="sidebar-toggle-btn">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                </div>
                <div id="thumbnail-container" class="thumbnail-container">
                    <!-- Thumbnails will be dynamically inserted here -->
                </div>
                <div id="document-info" class="document-info">
                    <h4>Document Info</h4>
                    <div id="info-content" class="info-content">
                        <p>No document loaded</p>
                    </div>
                </div>
            </div>

            <!-- PDF Viewer -->
            <div id="viewer-container" class="viewer-container">
                <div id="drop-zone" class="drop-zone active">
                    <i class="fas fa-file-pdf"></i>
                    <h2>Drop PDF file here</h2>
                    <p>or</p>
                    <button id="upload-btn" class="upload-btn">Choose File</button>
                </div>
                <div id="pdf-canvas-wrapper" class="pdf-canvas-wrapper" style="display: none;">
                    <canvas id="pdf-canvas"></canvas>
                    <div id="text-layer" class="text-layer"></div>
                    <div id="image-layer" class="image-layer"></div>
                </div>
            </div>
        </div>

        <!-- Edit Text Modal -->
        <div id="text-edit-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Edit Text</h3>
                    <button class="modal-close-btn" id="close-text-modal">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Text Content:</label>
                        <textarea id="text-content-input" rows="4"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Font Family:</label>
                            <select id="font-family-input">
                                <option value="Helvetica">Helvetica</option>
                                <option value="Times-Roman">Times Roman</option>
                                <option value="Courier">Courier</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Font Size:</label>
                            <input type="number" id="font-size-input" min="6" max="72" value="12">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Text Color:</label>
                        <input type="color" id="text-color-input" value="#000000">
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="cancel-text-edit-btn" class="btn btn-secondary">Cancel</button>
                    <button id="save-text-edit-btn" class="btn btn-primary">Save Changes</button>
                </div>
            </div>
        </div>

        <!-- Edit Image Modal -->
        <div id="image-edit-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Edit Image</h3>
                    <button class="modal-close-btn" id="close-image-modal">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="image-preview-container">
                        <img id="image-preview" src="" alt="Image preview">
                    </div>
                    <div class="form-group">
                        <label>Replace Image:</label>
                        <input type="file" id="image-replace-input" accept="image/*">
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="delete-image-btn" class="btn btn-danger">Delete Image</button>
                    <button id="cancel-image-edit-btn" class="btn btn-secondary">Cancel</button>
                    <button id="save-image-edit-btn" class="btn btn-primary">Save Changes</button>
                </div>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loading-spinner" class="loading-spinner" style="display: none;">
            <div class="spinner"></div>
            <p id="loading-text">Loading PDF...</p>
        </div>

        <!-- Toast Notifications -->
        <div id="toast-container" class="toast-container"></div>
    </div>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
    
    <!-- pdf-lib -->
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <!-- Application Scripts -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
